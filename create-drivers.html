<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setup Driver Profiles | Cambus Connect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    
    <!-- Firebase SDK v10 Compat (CDN) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-lg bg-white rounded-3xl p-8 shadow-2xl border border-slate-100 space-y-6">
        <div class="text-center space-y-2">
            <h1 class="text-2xl font-black text-indigo-600">Firebase Driver Setup Utility</h1>
            <p class="text-xs text-slate-500">Automatically creates driver credentials & Firestore profiles for both college projects.</p>
        </div>

        <div class="space-y-4">
            <button id="btn-run" class="w-full py-4 bg-indigo-600 hover:bg-indigo-700 text-white font-extrabold rounded-2xl shadow-lg shadow-indigo-600/25 transition-all active:scale-[0.98]">
                Start Setup & Registration
            </button>

            <!-- Console Log Output -->
            <div class="space-y-2">
                <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest">Execution Console</label>
                <div id="log-box" class="w-full h-64 bg-slate-900 rounded-2xl p-4 font-mono text-xs text-green-400 overflow-y-auto space-y-1.5 border border-slate-800">
                    <p class="text-slate-500">> Ready. Click start to begin.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const iistConfig = {
            apiKey: "AIzaSyCr7eid8VwqAD4OharNBSD8NME-kyC2FE4",
            authDomain: "cambus-medicap.firebaseapp.com",
            projectId: "cambus-medicap",
            storageBucket: "cambus-medicap.firebasestorage.app",
            messagingSenderId: "398140728981",
            appId: "1:398140728981:web:a2c4ed5d6296ad63185d9c"
        };

        const medicapsConfig = {
            apiKey: "AIzaSyD4sdDsx19EDGV5VrBP3bDwyOnmUogfRUw",
            authDomain: "cambus-iist.firebaseapp.com",
            projectId: "cambus-iist",
            storageBucket: "cambus-iist.firebasestorage.app",
            messagingSenderId: "560938631277",
            appId: "1:560938631277:web:69308fe046c5d613213f64"
        };

        const logBox = document.getElementById('log-box');
        const btnRun = document.getElementById('btn-run');

        function log(message, type = 'info') {
            const p = document.createElement('p');
            if (type === 'error') {
                p.className = 'text-red-400';
                p.textContent = `❌ ${message}`;
            } else if (type === 'success') {
                p.className = 'text-emerald-400 font-semibold';
                p.textContent = `✅ ${message}`;
            } else {
                p.className = 'text-green-400';
                p.textContent = `> ${message}`;
            }
            logBox.appendChild(p);
            logBox.scrollTop = logBox.scrollHeight;
        }

        btnRun.addEventListener('click', async () => {
            btnRun.disabled = true;
            btnRun.textContent = "Processing...";
            logBox.innerHTML = '';
            
            try {
                // 1. IIST Project Configuration
                log("Initializing connection to IIST Firebase Project (cambus-medicap)...");
                const iistApp = firebase.initializeApp(iistConfig, "IIST-Init");
                const iistAuth = firebase.auth(iistApp);
                const iistDb = firebase.firestore(iistApp);

                // Create IIST Driver Account in Auth
                log("Registering driver@indoreinstitute.com in IIST Auth...");
                try {
                    await iistAuth.createUserWithEmailAndPassword("driver@indoreinstitute.com", "driver12345");
                    log("Driver authentication user created successfully in IIST Auth.", "success");
                } catch (authErr) {
                    if (authErr.code === 'auth/email-already-in-use') {
                        log("Driver email already registered in IIST Auth. Proceeding to profile...", "info");
                    } else {
                        throw authErr;
                    }
                }

                // Add IIST Driver Profile to Firestore
                log("Creating driver profile document in IIST Firestore (users collection)...");
                await iistDb.collection('users').doc("driver@indoreinstitute.com").set({
                    name: "IIST Bus Driver",
                    role: "driver",
                    email: "driver@indoreinstitute.com",
                    assignedBusId: "demo-bus-101",
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                log("Driver profile document created successfully.", "success");

                // Initialize standard bus document
                log("Ensuring target Bus 101 document exists in IIST Firestore...");
                await iistDb.collection('buses').doc("demo-bus-101").set({
                    number: "101",
                    route: "Main Campus Loop (Via Geeta Bhawan)",
                    driver: "IIST Bus Driver",
                    status: "On Time",
                    location: { lat: 22.7196, lng: 75.8577 },
                    lastUpdate: "Setup completed"
                }, { merge: true });
                log("Bus 101 document updated.", "success");

                // Destroy/Clean IIST connection
                await iistApp.delete();
                log("IIST connection cleaned up. Starting Medi-Caps...");

                // 2. Medi-Caps Project Configuration
                log("Initializing connection to Medi-Caps Firebase Project (cambus-iist)...");
                const mediApp = firebase.initializeApp(medicapsConfig, "Medi-Init");
                const mediAuth = firebase.auth(mediApp);
                const mediDb = firebase.firestore(mediApp);

                // Create Medi-Caps Driver Account in Auth
                log("Registering driver@medicaps.com in Medi-Caps Auth...");
                try {
                    await mediAuth.createUserWithEmailAndPassword("driver@medicaps.com", "driver12345");
                    log("Driver authentication user created successfully in Medi-Caps Auth.", "success");
                } catch (authErr) {
                    if (authErr.code === 'auth/email-already-in-use') {
                        log("Driver email already registered in Medi-Caps Auth. Proceeding to profile...", "info");
                    } else {
                        throw authErr;
                    }
                }

                // Add Medi-Caps Driver Profile to Firestore
                log("Creating driver profile document in Medi-Caps Firestore (users collection)...");
                await mediDb.collection('users').doc("driver@medicaps.com").set({
                    name: "Medi-Caps Bus Driver",
                    role: "driver",
                    email: "driver@medicaps.com",
                    assignedBusId: "demo-bus-202",
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                log("Driver profile document created successfully.", "success");

                // Initialize standard bus document
                log("Ensuring target Bus 202 document exists in Medi-Caps Firestore...");
                await mediDb.collection('buses').doc("demo-bus-202").set({
                    number: "202",
                    route: "Rajwada Express (Via Vijay Nagar)",
                    driver: "Medi-Caps Bus Driver",
                    status: "On Time",
                    location: { lat: 22.7533, lng: 75.8937 },
                    lastUpdate: "Setup completed"
                }, { merge: true });
                log("Bus 202 document updated.", "success");

                // Destroy/Clean Medi-Caps connection
                await mediApp.delete();
                log("Medi-Caps connection cleaned up.");

                log("ALL REGISTRATION TASKS COMPLETED SUCCESSFULLY!", "success");

            } catch (err) {
                log(`Error: ${err.message}`, "error");
                console.error(err);
            } finally {
                btnRun.disabled = false;
                btnRun.textContent = "Run Setup Again";
            }
        });
    </script>
</body>
</html>
