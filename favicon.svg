<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="cambusGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0037b0" />
      <stop offset="100%" stop-color="#e85d2a" />
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.2" />
    </filter>
  </defs>
  <!-- Background Badge -->
  <rect width="64" height="64" rx="16" fill="url(#cambusGrad)" />
  <!-- Bus Silhouette -->
  <g fill="#ffffff" filter="url(#subtleShadow)">
