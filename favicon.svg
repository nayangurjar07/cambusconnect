    <path d="M16 17 C16 14 20 13 32 13 C44 13 48 14 48 17 L48 41 C48 43 46 45 44 45 L43 45 L43 49 C43 50.5 41 51 39.5 51 C38 51 38 49.5 38 49 L38 45 L26 45 L26 49 C26 50.5 24 51 22.5 51 C21 51 21 49.5 21 49 L21 45 L20 45 C18 45 16 43 16 41 Z" />
    <!-- Front Windshield -->
    <path d="M19 18 C19 17 21 16 32 16 C43 16 45 17 45 18 L45 27 L19 27 Z" fill="#002157" opacity="0.9" />
    <!-- Left & Right Headlights -->
    <circle cx="21" cy="38" r="2.5" fill="#fde047" />
    <circle cx="43" cy="38" r="2.5" fill="#fde047" />
    <!-- Front Grille Line -->
    <rect x="27" y="37" width="10" height="2" rx="1" fill="#cbd5e1" />
    <!-- Wheels -->
    <circle cx="23" cy="46" r="3" fill="#0f172a" />
    <circle cx="41" cy="46" r="3" fill="#0f172a" />
  </g>
  <!-- Signal Beam / Realtime Pulse -->
  <circle cx="48" cy="16" r="4" fill="#22c55e" />
  <circle cx="48" cy="16" r="2" fill="#ffffff" />
