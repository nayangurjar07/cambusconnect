<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Student Portal Login | Cambus Connect</title>
    <meta name="description" content="Sign in to your university student portal on Cambus Connect to view active bus passes, tracking, and schedule alerts."/>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg"/>

    <link rel="stylesheet" href="../../tailwind.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

    <!-- Firebase ESM Configuration -->
    <script type="importmap">
      {
        "imports": {
          "firebase/app": "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js",
          "firebase/auth": "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js",
          "firebase/firestore": "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js"
        }
      }
    </script>
    <script type="module" src="../../firebase-init.js"></script>
    <script type="module" src="../../app.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f0f4ff; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-[460px] bg-white rounded-3xl border border-blue-100 shadow-xl overflow-hidden flex flex-col">

        <!-- Header Banner -->
        <header class="p-6 bg-gradient-to-r from-blue-600 to-blue-700 text-white flex flex-col items-center gap-3 relative">
            <div class="absolute inset-0 opacity-10 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-white via-blue-200 to-transparent"></div>
            <div class="w-16 h-16 bg-white/10 rounded-2xl flex items-center justify-center backdrop-blur-md shadow-inner relative z-10">
                <span class="material-symbols-outlined text-[36px]" style="font-variation-settings: 'FILL' 1;">school</span>
            </div>
            <div class="text-center relative z-10">
                <h2 class="text-xl font-extrabold leading-none tracking-tight">Student Portal</h2>
                <p class="text-xs text-blue-200 font-bold mt-1 tracking-wider uppercase">Cambus Connect</p>
            </div>
        </header>

        <!-- Main Form Area -->
        <main class="p-6 flex-1 flex flex-col justify-center">

            <!-- Error Alert -->
            <div id="login-error-message" class="hidden flex items-start gap-2 p-3 bg-red-50 text-red-700 rounded-2xl border border-red-200 mb-4 text-sm font-semibold">
                <span class="material-symbols-outlined text-red-500 text-[20px]">error</span>
                <span id="error-text" class="flex-1">Invalid credentials</span>
            </div>

            <form id="login-form" class="space-y-4">
                <!-- Email / ID Input -->
                <div class="space-y-1">
                    <label class="text-xs font-bold text-gray-500 uppercase tracking-wider">Student ID / Email</label>
                    <div class="relative">
                        <input id="login-email" required name="email" type="text" placeholder="e.g. 0818CS221001 or name@college.edu" class="w-full h-12 px-4 border border-gray-200 rounded-xl focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none transition-all text-sm"/>
                        <span class="absolute right-4 top-1/2 -translate-y-1/2 material-symbols-outlined text-gray-400 text-[20px]">person</span>
                    </div>
                </div>

                <!-- Password Input -->
                <div class="space-y-1">
                    <label class="text-xs font-bold text-gray-500 uppercase tracking-wider">Password</label>
                    <div class="relative">
                        <input id="login-password" required name="password" type="password" placeholder="Enter your password" class="w-full h-12 pr-12 pl-4 border border-gray-200 rounded-xl focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none transition-all text-sm"/>
                        <button type="button" id="toggle-password" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-blue-600 transition-all flex items-center justify-center">
                            <span class="material-symbols-outlined text-[20px]">visibility</span>
                        </button>
                    </div>
                </div>

                <!-- Submit Button -->
                <button class="w-full h-12 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-bold text-sm shadow-md transition-all active:scale-[0.98] flex items-center justify-center gap-2" id="btn-login" type="submit">
                    <span>Sign In as Student</span>
                    <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
                </button>

                <div class="relative my-4">
                    <div class="absolute inset-0 flex items-center">
                        <div class="w-full border-t border-gray-200"></div>
                    </div>
                    <div class="relative flex justify-center text-xs">
                        <span class="bg-white px-3 text-gray-400 font-semibold uppercase tracking-wider">or</span>
                    </div>
                </div>

                <!-- Institutional Google SSO 1-Tap Button -->
                <button type="button" id="btn-google-sso" class="w-full h-12 bg-white hover:bg-slate-50 text-slate-700 border border-slate-300 rounded-xl font-bold text-sm shadow-sm transition-all active:scale-[0.98] flex items-center justify-center gap-3 cursor-pointer">
                    <svg class="w-5 h-5" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                    </svg>
                    <span>Continue with Institutional Google SSO</span>
                </button>
            </form>

            <div class="mt-4 text-center">
                <a href="../owner/index.html" class="inline-flex items-center gap-1.5 text-xs text-blue-600 font-bold hover:underline transition-all">
                    <span class="material-symbols-outlined text-[16px]">arrow_back</span>
                    Back to Home
                </a>
            </div>

            <!-- Secure Footer Badge -->
            <div class="bg-blue-50 px-4 py-2 flex items-center justify-center gap-1 rounded-xl mt-4">
                <span class="material-symbols-outlined text-blue-600 text-[16px]" style="font-variation-settings: 'FILL' 1;">verified_user</span>
                <span class="text-xs text-gray-500 font-medium">Secure Encrypted Authentication</span>
            </div>
        </main>
    </div>

    <script src="student-login.js"></script>
</body>
</html>
