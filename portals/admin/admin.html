<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Redirecting | Cambus Connect</title>
    <!-- Auth Guard check -->
    <script src="../../auth-guard.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const tab = urlParams.get('tab') || 'buses';
        
        const routeMap = {
            'buses': 'buses/buses.html',
            'students': 'students/students.html',
            'staff': 'staff/staff.html',
            'notifications': 'notifications/notifications.html',
            'lost-found': 'lost-found/lost-found.html',
            'support': 'support/support.html',
            'tracking-settings': 'gps-settings/gps-settings.html'
        };
        
        const target = routeMap[tab] || 'buses/buses.html';
        window.location.replace(target);
    </script>
</head>
<body style="font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #f8f9ff; color: #0037b0;">
    <div style="text-align: center;">
        <h2>Redirecting to dashboard...</h2>
    </div>
</body>
</html>
