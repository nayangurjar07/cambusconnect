<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Admin Login | Cambus Connect</title>

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

    <!-- Firebase ESM Configuration -->
    <script type="importmap">
      {
        "imports": {
          "firebase/app": "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js",
          "firebase/auth": "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js",
          "firebase/firestore": "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js"
        }
      }
    </script>
    <script type="module" src="../../firebase-init.js"></script>
    <script type="module" src="../../app.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f0f0ff; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-[460px] bg-white rounded-3xl border border-indigo-100 shadow-xl overflow-hidden flex flex-col">

        <!-- Header Banner -->
        <header class="p-6 bg-gradient-to-r from-indigo-600 to-indigo-800 text-white flex flex-col items-center gap-3 relative">
            <div class="absolute inset-0 opacity-10 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-white via-indigo-200 to-transparent"></div>
            <div class="w-16 h-16 bg-white/10 rounded-2xl flex items-center justify-center backdrop-blur-md shadow-inner relative z-10">
                <span class="material-symbols-outlined text-[36px]" style="font-variation-settings: 'FILL' 1;">admin_panel_settings</span>
            </div>
            <div class="text-center relative z-10">
                <h2 class="text-xl font-extrabold leading-none tracking-tight">Admin Portal</h2>
                <p class="text-xs text-indigo-200 font-bold mt-1 tracking-wider uppercase">Cambus Connect</p>
            </div>
        </header>

        <!-- Main Form Area -->
        <main class="p-6 flex-1 flex flex-col justify-center">

            <div id="login-error-message" class="hidden flex items-start gap-2 p-3 bg-red-50 text-red-700 rounded-2xl border border-red-200 mb-4 text-sm font-semibold">
                <span class="material-symbols-outlined text-red-500 text-[20px]">error</span>
                <span id="error-text" class="flex-1">Invalid credentials</span>
            </div>

            <form id="login-form" class="space-y-4">
                <div class="space-y-1">
                    <label class="text-xs font-bold text-gray-500 uppercase tracking-wider">Admin Email</label>
                    <div class="relative">
                        <input id="login-email" required name="email" type="text" placeholder="e.g. admin@indoreinstitute.com" class="w-full h-12 px-4 border border-gray-200 rounded-xl focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 outline-none transition-all text-sm"/>
                        <span class="absolute right-4 top-1/2 -translate-y-1/2 material-symbols-outlined text-gray-400 text-[20px]">badge</span>
                    </div>
                </div>

                <div class="space-y-1">
                    <label class="text-xs font-bold text-gray-500 uppercase tracking-wider">Password</label>
                    <div class="relative">
                        <input id="login-password" required name="password" type="password" placeholder="Enter admin password" class="w-full h-12 pr-12 pl-4 border border-gray-200 rounded-xl focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 outline-none transition-all text-sm"/>
                        <button type="button" id="toggle-password" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-indigo-600 transition-all flex items-center justify-center">
                            <span class="material-symbols-outlined text-[20px]">visibility</span>
                        </button>
                    </div>
                </div>

                <button class="w-full h-12 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-bold text-sm shadow-md transition-all active:scale-[0.98] flex items-center justify-center gap-2" id="btn-login" type="submit">
                    <span>Sign In as Admin</span>
                    <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
                </button>
            </form>

            <div class="mt-4 text-center">
                <a href="../owner/index.html" class="inline-flex items-center gap-1.5 text-xs text-indigo-600 font-bold hover:underline transition-all">
                    <span class="material-symbols-outlined text-[16px]">arrow_back</span>
                    Back to Home
                </a>
            </div>

            <div class="bg-indigo-50 px-4 py-2 flex items-center justify-center gap-1 rounded-xl mt-4">
                <span class="material-symbols-outlined text-indigo-600 text-[16px]" style="font-variation-settings: 'FILL' 1;">verified_user</span>
                <span class="text-xs text-gray-500 font-medium">Secure Encrypted Authentication</span>
            </div>
        </main>
    </div>

    <script src="admin-login.js"></script>
</body>
</html>
