<script>
        // Set current date
        const dateEl = document.getElementById('current-date');
        const now = new Date();
        const options = { month: 'long', day: 'numeric', year: 'numeric' };
        dateEl.textContent = now.toLocaleDateString('en-US', options);

        // Simple Headcount Logic
        let currentCount = 12;
        const headcountDisplay = document.getElementById('headcount');
        
        function updateCount(val) {
            currentCount = Math.max(0, Math.min(45, currentCount + val));
            headcountDisplay.textContent = currentCount;
            
            // Visual feedback
            headcountDisplay.classList.add('scale-110', 'text-secondary');
            setTimeout(() => {
                headcountDisplay.classList.remove('scale-110', 'text-secondary');
            }, 150);
        }

        // Micro-interaction for buttons
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', function() {
                this.classList.add('active:scale-95');
            });
        });
